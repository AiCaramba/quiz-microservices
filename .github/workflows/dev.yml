name: Deploy to DEV EC2

on:
  push:
    branches: ["dev"]

env:
  AWS_REGION: eu-north-1
  AWS_REPOSITORY: development
  CONTAINER_NAME: collections-service

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to DEV EC2
    runs-on: debian-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-login-ecr@v2

      - name: Build and Push to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI = "$ECR_REGISTRY/$AWS_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: $${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd {{ env.APP_DIR }}
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --pasword-stdin ${{ steps.login-ecr.outputs.registry }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
